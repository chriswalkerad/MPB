name: Fetch News

on:
  schedule:
    # every 6 hours, offset from top of hour to dodge cron congestion
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # scheduled runs pin the checkout to the SHA at run creation; a queued
      # run can otherwise execute against a stale tree and redo finished work
      - name: Sync to latest
        run: git pull

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Fetch and curate news
        run: node scripts/fetch-news.js
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json scripts/news-seen.json
          if git diff --cached --quiet; then
            echo "No news changes; skipping commit."
          else
            if ! git pull --rebase --autostash; then
              git rebase --abort 2>/dev/null || true
              echo "concurrent update conflict; skipping this run (next run self-heals)"
              exit 0
            fi
            git commit -m "chore(news): refresh curated news $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
