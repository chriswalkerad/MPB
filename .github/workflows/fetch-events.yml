name: Fetch Events

on:
  schedule:
    # weekly, monday 14:17 UTC
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Discover and curate events
        run: node scripts/fetch-events.js
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json scripts/events-seen.json
          if git diff --cached --quiet; then
            echo "No event changes; skipping commit."
          else
            git pull --rebase --autostash
            git commit -m "chore(events): weekly automated events refresh $(date -u '+%Y-%m-%d')"
            git push
          fi
